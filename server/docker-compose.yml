services:
  mongodb:
    image: mongo:7
    container_name: mediaid-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mediaid_mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mediaid-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb

volumes:
  mediaid_mongo_data:
